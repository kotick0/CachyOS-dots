# ─────────────────────────────────────────────────
# Font
# ─────────────────────────────────────────────────
font_family      Hack Nerd Font Bold
font_size        11.3

# ─────────────────────────────────────────────────
# Shell
# ─────────────────────────────────────────────────
shell            /bin/fish
close_on_child_death no

# ─────────────────────────────────────────────────
# Appearance / Padding
# ─────────────────────────────────────────────────
window_padding_width 0

# ─────────────────────────────────────────────────
# Tabs
# ─────────────────────────────────────────────────
tab_bar_style    hidden

# ─────────────────────────────────────────────────
# Opacity 
# ─────────────────────────────────────────────────
background_opacity 0.45

# ─────────────────────────────────────────────────
# Color scheme — Fairy Floss (Gogh)
# ─────────────────────────────────────────────────
background  #5A5475
foreground  #C2FFDF
cursor      #FFB8D1

# Normal colors
color0   #42395D
color1   #A8757B
color2   #FF857F
color3   #E6C000
color4   #AE81FF
color5   #716799
color6   #C2FFDF
color7   #F8F8F2

# Bright colors
color8   #75507B
color9   #FFB8D1
color10  #F1568E
color11  #D5A425
color12  #C5A3FF
color13  #8077A8
color14  #C2FFFF
color15  #F8F8F0

# ─────────────────────────────────────────────────
# Key bindings
# ─────────────────────────────────────────────────
clear_all_shortcuts yes

# Clipboard
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

# Split 
map alt+a  launch --location=vsplit

# Close current pane 
map alt+q  close_window_with_confirmation

# Switch panes
map alt+1  first_window
map alt+2  second_window
map alt+3  third_window

# ─────────────────────────────────────────────────
# Wayland 
# ─────────────────────────────────────────────────
linux_display_server wayland

